name: franky

# franky's own integration test suite, run in GitHub Actions against franka-sim
# instead of an FR3.
#
# franky (https://github.com/TimSchneider42/franky) is a Python/C++ wrapper
# around libfranka: a Ruckig planner in front of the real control loop. It
# ships tests/pytest/test_integration_franky_sim.py -- 19 tests that connect a
# franky.Robot and franky.Gripper to a simulated robot and drive every motion
# type through it: joint/Cartesian position and velocity, joint/Cartesian
# impedance (motions and trackers, null-space posture), raw torques, motion
# callbacks, gripper homing/move/grasp/stop, motion-object reuse.
#
# Upstream those tests start franky's own MuJoCo simulator and FCI server
# in-process (the franky_sim package). franka-sim serves the same FCI wire
# protocol, so the same file runs unmodified against it: the job fetches the
# test file from the franky tag matching the installed wheel and puts a small
# stand-in for franky_sim (examples/franky/franky_sim/) on PYTHONPATH that,
# instead of starting a simulator, hands the tests 127.0.0.1 and moves the arm
# back to the initial configuration a fresh simulator would have.
#
# This is a pip-only stack: no Docker build, no colcon workspace. The whole
# job is `pip install franky-control pytest pytest-timeout`, a curl, the sim
# action, and pytest -- one process per test (examples/franky/run-tests.sh).
#
# Needs franka-sim >= 1.1.3 (`tag: latest` below). On 1.1.2 five of the 19
# fail: three impedance tests, because the sim answered the Move interrupted
# by StopMove with kSuccess instead of kPreempted; two gripper grasp tests,
# because grasp success was judged by a stall heuristic instead of
# libfranka's epsilon band -- see examples/franky/README.md.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: catches franky releases and franka-sim regressions without a push.
    - cron: '43 4 * * 1'

env:
  # The wheel pins the libfranka it bundles; bumping this one line is the whole
  # upgrade procedure. Only franky wheels built against libfranka >= 0.20 speak
  # FCI v10 -- see examples/franky/README.md. The test file is fetched from the
  # franky tag v${FRANKY_VERSION}, so tests and wheel always match.
  FRANKY_VERSION: 2.0.0
  FRANKY_REPO: https://github.com/TimSchneider42/franky
  # Host networking, so this is the address franky connects to.
  ROBOT_IP: 127.0.0.1
  SIM_CONTAINER: franka-sim
  # Where the fetched test file goes. Untracked; the checkout is disposable.
  TESTS_DIR: ${{ github.workspace }}/franky-tests

jobs:
  integration-tests:
    name: franky integration tests
    runs-on: ubuntu-latest
    # About two minutes of wall time: ~20 s for the wheel, ~10 s for the sim
    # to come up, ~60 s of robot motion.
    timeout-minutes: 15

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Start a simulated FR3
        uses: BarisYazici/libfranka-sim@v1
        with:
          image: ghcr.io/barisyazici/franka-sim
          tag: latest
          container-name: ${{ env.SIM_CONTAINER }}
          # Default args: the sim logs limit violations but aborts nothing.
          # With --enforce-motion-limits the two SimpleTorqueMotion tests
          # exceed the joint-1 velocity limit and reflex, as an FR3 would; add
          # that lane with `-k 'not (simple_torque_motion and not
          # signal_timeout)'` if you want it (17 pass).
          #
          # FCI on 1337 and the gripper server on 1338, which the five gripper
          # tests need. The action blocks until franka-sim-check completes a
          # real Connect handshake, so the steps below can assume a live robot.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # pytest-timeout: the test file's @pytest.mark.timeout markers need it.
      - name: Install franky and pytest
        run: pip install "franky-control==${FRANKY_VERSION}" pytest pytest-timeout

      - name: Fetch franky's integration tests
        run: |
          tag="v${FRANKY_VERSION}"
          echo "franky tag: $tag"
          git ls-remote --tags "${FRANKY_REPO}.git" "refs/tags/${tag}"
          mkdir -p "$TESTS_DIR"
          curl -fsSL -o "$TESTS_DIR/test_integration_franky_sim.py" \
            "https://raw.githubusercontent.com/TimSchneider42/franky/${tag}/tests/pytest/test_integration_franky_sim.py"
          sha256sum "$TESTS_DIR/test_integration_franky_sim.py"
          echo "$(grep -c '^def test_' "$TESTS_DIR/test_integration_franky_sim.py") tests"

      # One pytest process per test, each under its own `timeout`: a failed
      # test's franky.Robot would otherwise keep the sim's single client slot
      # and wedge every test after it -- see run-tests.sh. The script puts the
      # franky_sim stand-in on PYTHONPATH and passes ROBOT_IP through as
      # FRANKA_SIM_HOST.
      - name: Run franky's integration tests
        env:
          FRANKA_SIM_HOST: ${{ env.ROBOT_IP }}
        # test_gripper_grasp_success asserts that grasping thin air succeeds --
        # franky-sim's position-move convention. A real hand, and this sim,
        # close until the fingers stall and answer false. See the README.
        run: >-
          examples/franky/run-tests.sh "$TESTS_DIR/test_integration_franky_sim.py"
          -k 'not test_gripper_grasp_success'

      - name: franka-sim logs
        if: failure()
        run: docker logs "$SIM_CONTAINER" || true
